[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kron-consistency"
version = "1.0.0"
description = "Reproduction code for Kron consistency of graph filters under exact boundary equivalence"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Xianghui Meng" },
    { name = "Jionghao Lin" },
]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
]

[project.optional-dependencies]
gcn = [
    "torch>=2.0",
    "torch-geometric>=2.4",
]

[tool.setuptools.packages.find]
include = ["kron_consistency*"]
